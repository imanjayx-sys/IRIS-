    var vc=id?{deviceId:{exact:id},width:{ideal:1280},height:{ideal:720}}:{facingMode:{ideal:S.fac},width:{ideal:1280},height:{ideal:720},aspectRatio:{ideal:1.7778}};

$("bt").onclick=function(){S.autoTorch=false;setTorch(!S.torchOn)};

var FK="iris_faces";
function faces(){try{return JSON.parse(localStorage.getItem(FK)||"[]")}catch(e){return[]}}
function ovl(a,b){return a[0]<b[0]+b[2]&&b[0]<a[0]+a[2]&&a[1]<b[1]+b[3]&&b[1]<a[1]+a[3]}
function setTorch(on){var tr=v.srcObject&&v.srcObject.getVideoTracks()[0];if(!tr)return;S.torchOn=on;tr.applyConstraints({advanced:[{torch:on}]}).catch(function(){S.torchOn=!on})}
function loadDeep(){
  S.dstep="memuat...";
  var src='import*as T from"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js";let det;onmessage=async e=>{const d=e.data;if(d.init){try{det=await T.pipeline("zero-shot-object-detection","Xenova/owlvit-base-patch32",{dtype:"q8",progress_callback:p=>{if(p.status==="progress")postMessage({p:Math.round(p.progress)})}});postMessage({ready:1})}catch(err){postMessage({err:String(err&&err.message||err)})}return}try{const r=await det(new T.RawImage(new Uint8ClampedArray(d.buf),d.w,d.h,3),d.labels,{threshold:.12});postMessage({r:r})}catch(err){postMessage({r:[],err:String(err&&err.message||err)})}};';
  var w=S.dw=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})),{type:"module"});
  w.onerror=function(e){S.dstep="gagal";S.err2="Mendalam: "+(e.message||"worker")};
  w.onmessage=function(e){var d=e.data;
    if(d.p!==undefined)S.dstep=d.p+"%";
    else if(d.ready){S.dready=true;S.dstep="aktif"}
    else if(d.r){S.dbusy=false;if(d.err)S.err2="Mendalam: "+d.err;S.dt=performance.now();
      S.dres=d.r.sort(function(a,b){return b.score-a.score}).map(function(o){return{cls:o.label,sc:o.score,x0:o.box.xmin/S.dW,y0:o.box.ymin/S.dH,x1:o.box.xmax/S.dW,y1:o.box.ymax/S.dH}})}
    else if(d.err){S.dstep="gagal";S.err2="Mendalam: "+d.err}};
  w.postMessage({init:1});
}
function deepTick(now){
  if(!S.dready||S.dbusy||now<(S.dnext||0)||!v.videoWidth)return;S.dbusy=true;S.dnext=now+3000;
  var W=320,H=Math.round(W*v.videoHeight/v.videoWidth),c=S.dc||(S.dc=document.createElement("canvas")),q;c.width=W;c.height=H;
  q=c.getContext("2d",{willReadFrequently:true});q.drawImage(v,0,0,W,H);
  var px=q.getImageData(0,0,W,H).data,rgb=new Uint8Array(W*H*3);
  for(var i=0,j=0;i<px.length;i+=4){rgb[j++]=px[i];rgb[j++]=px[i+1];rgb[j++]=px[i+2]}
  S.dW=W;S.dH=H;S.dw.postMessage({buf:rgb.buffer,w:W,h:H,labels:Object.keys(DL)},[rgb.buffer]);
}
function loadFace(){
  if(S.fp)return;
  var u="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/";
  S.fp=ld("https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js")
    .then(function(){return Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(u),faceapi.nets.faceLandmark68TinyNet.loadFromUri(u),faceapi.nets.faceRecognitionNet.loadFromUri(u)])})
    .then(function(){S.fready=true}).catch(function(e){S.err2="Modul wajah gagal: "+(e&&e.message||e)});
}
async function faceTick(now){
  if(!S.fon||!S.fready||S.fbusy||now<(S.fnext||0)||!S.tracks.some(function(t){return t.cls==="person"}))return;
  S.fbusy=true;S.fnext=now+1200;
  try{
    var r=await faceapi.detectAllFaces(v,new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5})).withFaceLandmarks(true).withFaceDescriptors(),db=faces();
    S.fc=r.map(function(f){var b=f.detection.box,best=null,bd=.5;
      db.forEach(function(p){var d=faceapi.euclideanDistance(f.descriptor,p.desc);if(d<bd){bd=d;best=p.name}});
      return{box:[b.x/v.videoWidth,b.y/v.videoHeight,b.width/v.videoWidth,b.height/v.videoHeight],name:best,desc:f.descriptor}});
    S.ft=performance.now();
  }catch(e){S.err2="Wajah: "+(e&&e.message||e)}
  S.fbusy=false;
}
function nameFace(f){
  var db=faces(),names={};db.forEach(function(p){names[p.name]=1});
  var n=prompt("Nama individu ini? Pastikan beliau bersetuju. Data kekal pada peranti anda sahaja.");
  if(!n)return;n=n.trim().slice(0,30);if(!n)return;
  if(!names[n]&&Object.keys(names).length>=15){alert("Had 15 orang telah dicapai. Padam data wajah untuk menambah.");return}
  db.push({name:n,desc:Array.from(f.desc)});
  try{localStorage.setItem(FK,JSON.stringify(db))}catch(e){alert("Gagal menyimpan data.")}
}
function track(preds,now){
  var vw=v.videoWidth,vh=v.videoHeight,used={};
  var nt=[];
  preds.forEach(function(p){
    var cx=(p.bbox[0]+p.bbox[2]/2)/vw,cy=(p.bbox[1]+p.bbox[3]/2)/vh,a=p.bbox[2]*p.bbox[3]/(vw*vh),best=null,bd=.15;
    S.tracks.forEach(function(t,i){if(used[i]||t.cls!==p.class)return;var d=Math.hypot(t.cx-cx,t.cy-cy);if(d<bd){bd=d;best=i}});
    var t;
    if(best!==null){used[best]=1;t=S.tracks[best]}else t={cls:p.class,hist:[]};
    t.cx=cx;t.cy=cy;t.a=a;t.sc=p.score;t.bbox=p.bbox;t.seen=now;t.hist.push({t:now,cx:cx,cy:cy,a:a});if(t.hist.length>8)t.hist.shift();
    t.pred=null;t.tilt=p.class==="bottle"&&p.bbox[2]>p.bbox[3]*1.15&&preds.some(function(q){return q.class==="person"&&ovl(q.bbox,p.bbox)});var h=t.hist;
    if(h.length>=4){var f=h[0],l=h[h.length-1],dt=(l.t-f.t)/1000;
      if(dt>.1){var vx=(l.cx-f.cx)/dt,vy=(l.cy-f.cy)/dt;
        if(vy>.25&&p.class!=="person"){var G=1.1,tt=(-vy+Math.sqrt(vy*vy+2*G*Math.max(.02,.95-l.cy)))/G,pts=[];
          for(var k=0;k<=10;k++){var q=tt*k/10;pts.push([l.cx+vx*q,l.cy+vy*q+.5*G*q*q])}
          t.pred={t:tt,pts:pts,lx:l.cx+vx*tt}}
        if(l.a>.08&&l.a/f.a>1.6&&dt<1)t.loom=true}}
    nt.push(t);
  });
  S.tracks=nt;
}
function advise(now){
  var danger=S.tracks.find(function(t){return DANGER[t.cls]&&t.a>.02}),
      loom=S.tracks.find(function(t){return t.loom}),
      fall=S.tracks.find(function(t){return t.pred&&t.pred.t<1.3}),
      ppl=S.tracks.filter(function(t){return t.cls==="person"}).length;
  if(danger||loom){if(now>S.ovT-500)S.ovT=now+3000;if(navigator.vibrate&&!S.vib){navigator.vibrate([200,100,200]);S.vib=1}}else S.vib=0;
  S.ovOn=S.ov||now<S.ovT;
  var thr=danger&&S.tracks.some(function(p){return p.cls==="person"&&ovl(p.bbox,danger.bbox)}),
      tilt=S.tracks.find(function(t){return t.tilt}),
      fence=S.dres&&now-S.dt<25000&&S.dres.some(function(d){return d.cls==="fence"});
  S.fence=!!fence;
  S.adv=thr?"ANCAMAN! Orang memegang "+lab(danger.cls)+". Jauhkan diri, elak ke tepi.":
    danger?"BAHAYA! "+lab(danger.cls)+" dikesan. Jauhkan diri dan elak ke tepi.":
    loom?"BAHAYA! Objek meluru ke arah anda. Elak sekarang!":
    fall?lab(fall.cls)+" akan jatuh. Alihkan kaki atau tangan.":
    tilt?"Botol dipegang condong. Tegakkan pegangan sebelum ia jatuh.":
    fence?"Pagar dikesan. Lihat panel Combat Assist.":
    S.dark>.7?"Gelap. Mod malam aktif, nyalakan lampu jika boleh.":
    ppl?ppl+" orang berhampiran.":"Persekitaran kelihatan selamat.";

async function detect(){
  var n0=performance.now();
  if(busy&&n0-(S.ds||0)>10000)busy=false;
  if(busy||!model||!v.videoWidth||n0<(S.nt||0))return;busy=true;S.nt=n0+180;S.ds=n0;
  try{var all=await model.detect(v,S.ovOn?30:10,.55),now=performance.now();S.lat=S.lat?S.lat*.7+(now-n0)*.3:(now-n0);
    all.sort(function(a,b){return(DANGER[b.class]?2:0)+b.score-(DANGER[a.class]?2:0)-a.score});
    S.preds=S.ovOn?all:all.slice(0,5);S.lastDet=now;track(S.preds,now)}catch(e){S.err2=String(e&&e.message||e)}
  busy=false;
}
function status(){
  var now=performance.now();
  if(now>(S.darkT||0)){S.darkT=now+500;mx.drawImage(v,0,0,32,18);var d=mx.getImageData(0,0,32,18).data,s=0;for(var i=0;i<d.length;i+=4)s+=d[i]*.3+d[i+1]*.59+d[i+2]*.11;S.dark=1-s/(d.length/4)/255;S.night=S.dark>.7}
  S.tracks=S.tracks.filter(function(t){return now-t.seen<Math.max(1500,(S.lat||0)*2.5)});
  S.ovOn=S.ov||now<S.ovT;
  if(S.torch){
    if(S.night&&S.ovOn&&!S.torchOn){setTorch(true);S.autoTorch=true}
    else if(!S.ovOn&&S.torchOn&&S.autoTorch){setTorch(false);S.autoTorch=false}
  }
  $("bt").classList.toggle("hide",!(S.torch&&(S.night||S.torchOn)));
  $("bt").textContent=S.torchOn?"Matikan lampu suluh":"Nyalakan lampu suluh?";
  $("bl").textContent=!S.off?"Simpan untuk offline":(model&&S.dready&&S.fready?"Offline siap ✔":"Menyimpan offline ("+((model?1:0)+(S.dready?1:0)+(S.fready?1:0))+"/3)...");
  $("bw").textContent="Ingatan wajah: "+(S.fready&&S.fon?"ON":(S.fp&&!S.fready?"memuat...":"OFF"));
  $("bd").textContent=S.dready?"Imbasan mendalam: ON":(S.dstep?"Mendalam: "+S.dstep:"Imbasan mendalam");
  if(!model){S.adv=S.err?"AI GAGAL - "+S.err:"Kamera aktif. AI: "+S.step+"...";return}
  if(!S.mt)S.mt=now;
  var last=S.lastDet||S.mt;
  if(!S.lastDet&&now-last<40000){S.adv="AI memanaskan model kali pertama ("+Math.round((now-last)/1000)+"s, sehingga 40s)...";return}
  if(now-last>8000){S.adv="AI tidak bertindak balas ("+Math.round((now-last)/1000)+"s). Muat semula halaman."+(S.err2?" Ralat: "+S.err2:"");return}
  advise(now);
  if(S.err2)S.adv+=" ["+S.err2+"]";
}
function eye(ox,w,h,col){

      x.save();x.shadowBlur=0;x.fillStyle="rgba(0,0,0,.55)";x.beginPath();x.ellipse(ls[0],ls[1],34,11,0,0,7);x.fill();x.restore();
      x.beginPath();x.ellipse(ls[0],ls[1],34,11,0,0,7);x.stroke();x.fillText("JATUH "+t.pred.t.toFixed(1)+"s",ls[0]-30,ls[1]+26);var bw=b[0]-a[0],bh=b[1]-a[1];x.strokeRect(ls[0]-bw/2,ls[1]-bh*.15,bw,bh*.3)}
    if(t.tilt&&!t.pred){var c0=(a[0]+b[0])/2,fl=P(0,.95)[1],bw2=b[0]-a[0];x.setLineDash([4,5]);x.beginPath();x.moveTo(c0,b[1]);x.lineTo(c0,fl);x.stroke();x.setLineDash([]);x.strokeRect(c0-bw2/2,fl-8,bw2,16);x.fillText("RISIKO JATUH",c0-36,fl+24)}
  });

    S.dres.slice(0,S.ovOn?99:5).forEach(function(d){var a=P(d.x0,d.y0),b=P(d.x1,d.y1);x.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);x.fillText(lab(d.cls)+" "+Math.round(d.sc*100)+"%",a[0],a[1]-4)})}
  if(S.fc&&nowt-S.ft<2500){S.fc.forEach(function(f){var a=P(f.box[0],f.box[1]),b=P(f.box[0]+f.box[2],f.box[1]+f.box[3]);x.strokeStyle=x.fillStyle=f.name?"#7dff9a":"#ffffff";x.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);x.fillText(f.name?f.name:"TIDAK DIKENALI (ketik untuk namakan)",a[0],b[1]+14)})}

    ["COMBAT ASSIST: PAGAR","1. Cari pintu atau bahagian rendah","2. Periksa hujung tajam, pijakan stabil","3. Pegang kuat, lompat ke tempat rata","Pastikan anda dibenarkan melintas"].forEach(function(l,i){x.fillText(l,ox+m+8,h-m-122+i*16)})}

  x.strokeStyle=col;x.fillStyle=col;
